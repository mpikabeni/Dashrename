services:
  - type: web
    name: dash-renamer
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: DATA_DIR
        value: /app/data
    disk:
      name: dash-data
      mountPath: /app/data
      sizeGB: 10
